name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.LITEPHONE_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.LITEPHONE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Signing key missing. Add the LITEPHONE_KEYSTORE and LITEPHONE_KEYSTORE_PASSWORD repository secrets (see README)."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/litephone.jks"
          echo "LITEPHONE_KEYSTORE_FILE=$RUNNER_TEMP/litephone.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LITEPHONE_KEYSTORE_PASSWORD: ${{ secrets.LITEPHONE_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LitePhone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LitePhone-apk
          path: LitePhone.apk

      - name: Publish as a release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lite Phone build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: LitePhone.apk
          make_latest: "true"
